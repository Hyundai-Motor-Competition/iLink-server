spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

pickup:
  jwt:
    secret: ${JWT_SECRET}
  crypto:
    phone-key: ${PHONE_ENCRYPTION_KEY}

logging:
  level:
    com.example.pickupservice: INFO
    org.hibernate.SQL: INFO
