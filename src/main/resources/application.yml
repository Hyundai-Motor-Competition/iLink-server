spring:
  application:
    name: pickup-service
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  task:
    scheduling:
      pool:
        size: 4
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s

server:
  tomcat:
    # 한도(6MB)를 넘은 multipart 본문을 Tomcat이 끝까지 읽어 버려야 413 응답이 클라이언트에 닿는다(기본 2MB면 연결을 끊음)
    max-swallow-size: 10MB

pickup:
  async:
    event:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
  idempotency:
    cleanup-interval: PT1H
  notification:
    resend-interval: PT60S
  sse:
    ping-interval: PT30S
  jwt:
    access-ttl: PT30M
  invite:
    base-url: https://app.example/invite/
  map:
    kakao:
      base-url: https://dapi.kakao.com
      api-key: ${KAKAO_REST_API_KEY:}
    kakao-mobility:
      base-url: https://apis-navi.kakaomobility.com
  session:
    eta-valid-for: PT1M
    call-trigger-eta: PT180S
    boarding-cancel-window: PT10S
    auto-complete-interval: PT10S
    call-trigger-distance-meters: 700
    help-request-interval: PT60S
    prep-extension-limit: PT15M
    data-retention-days: 90
  call:
    signal-lost-check-interval: PT15S
  profile:
    endpoint: ${MINIO_ENDPOINT:}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    bucket: ${MINIO_BUCKET:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    url-ttl: PT10M

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
