spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pickup}
    username: ${DB_USERNAME:pickup}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

pickup:
  jwt:
    secret: ${JWT_SECRET}
  crypto:
    phone-key: ${PHONE_ENCRYPTION_KEY}
  fcm:
    project-id: ${FCM_PROJECT_ID:pickup-service-dev}
    credentials-path: ${FCM_CREDENTIALS_PATH:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.example.pickupservice: DEBUG
    org.hibernate.SQL: DEBUG
