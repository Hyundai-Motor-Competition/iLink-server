# dev DB(PostgreSQL 17 + PostGIS 3.7). 파이프라인은 적용하지 않는다(운영자가 kubectl apply). 비밀번호는 Secret postgres(POSTGRES_PASSWORD)를 미리 만든다
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ilink-dev
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ilink
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: ilink
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:17-3.7
          env:
            - name: POSTGRES_DB
              value: pickup
            - name: POSTGRES_USER
              value: pickup
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: Asia/Seoul
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pickup", "-d", "pickup"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ilink-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
