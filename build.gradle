plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Pickup service backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 테스트 DB 방식. auto(기본): Windows는 embedded, 그 밖의 OS는 testcontainers.
// embedded: 내장 PostgreSQL 17 + PostGIS Windows 묶음(Docker 없음, Windows x64만)
// testcontainers: postgis/postgis:17-3.7 컨테이너(Docker 필요)
// 강제: ./gradlew test -Ppickup.test.db=embedded|testcontainers
// 같은 규칙이 src/test의 TestPostgis.Mode에 있다(Gradle 밖에서 돌릴 때 쓴다)
def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('windows')
def requestedTestDb = providers.gradleProperty('pickup.test.db').getOrElse('auto').trim().toLowerCase(Locale.ROOT)
def testDbMode = [
		auto          : isWindows ? 'embedded' : 'testcontainers',
		embedded      : 'embedded',
		testcontainers: 'testcontainers',
][requestedTestDb]
if (testDbMode == null) {
	throw new GradleException("pickup.test.db는 auto · embedded · testcontainers 중 하나입니다: ${requestedTestDb}")
}
def useWindowsEmbeddedTestDb = testDbMode == 'embedded' && isWindows

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			ivy {
				name = 'OSGeoPostgisWindows'
				url = 'https://download.osgeo.org/postgis/windows'
				patternLayout {
					artifact '[organisation]/[module]-[revision]x64.[ext]'
					artifact '[organisation]/archive/[module]-[revision]x64.[ext]'
				}
				metadataSources { artifact() }
			}
		}
		filter { includeGroup 'pg17' }
	}
}

configurations {
	postgisBundle
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.hibernate.orm:hibernate-spatial'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'com.google.firebase:firebase-admin:9.11.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	// EmbeddedPostgis가 쓰는 API jar는 모든 OS에 둔다. JUnit이 테스트 클래스를 훑을 때 EmbeddedPostgis도 읽으므로
	// 실행 클래스패스에 없으면 Linux(Jenkins)에서 NoClassDefFoundError로 탐색이 실패한다. PostgreSQL 바이너리는 아래 embedded 모드에서만 넣는다
	testImplementation('io.zonky.test:embedded-postgres:2.2.2') {
		exclude group: 'io.zonky.test.postgres'
	}
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	postgisBundle 'pg17:postgis-bundle-pg17:3.6.2@zip'
}

if (useWindowsEmbeddedTestDb) {
	dependencies {
		// 기본 의존인 4개 OS 바이너리(약 116MB) 대신 Windows 것만 넣는다
		testRuntimeOnly platform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.11.0')
		testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-windows-amd64'
	}
}

def postgisDir = layout.buildDirectory.dir('postgis-bundle')

def unpackPostgisBundle = tasks.register('unpackPostgisBundle', Sync) {
	description = 'Unpacks the PostGIS Windows bundle that the embedded PostgreSQL test server loads.'
	from({ zipTree(configurations.postgisBundle.singleFile) }) {
		include '*/bin/*.dll', '*/lib/**', '*/share/**'
		eachFile { it.relativePath = new RelativePath(true, it.relativePath.segments.drop(1)) }
		includeEmptyDirs = false
	}
	into postgisDir
}

[tasks.named('test'), tasks.named('bootTestRun')].each { taskProvider ->
	taskProvider.configure {
		systemProperty 'pickup.test.db', testDbMode
		if (useWindowsEmbeddedTestDb) {
			dependsOn unpackPostgisBundle
			systemProperty 'pickup.test.postgis-dir', postgisDir.get().asFile.absolutePath
		} else if (testDbMode == 'embedded') {
			doFirst {
				throw new GradleException('pickup.test.db=embedded는 Windows x64에서만 돈다. '
						+ 'PostGIS 바이너리를 Windows 묶음으로만 받기 때문이다. 이 OS에서는 testcontainers(기본)를 쓴다')
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// Dockerfile이 build/libs/app.jar를 이미지에 넣는다
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}
